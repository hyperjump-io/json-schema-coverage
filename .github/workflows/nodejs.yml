name: Node.js Automation

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        vitest: [4, 5]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install
      - run: npm install vitest@${{ matrix.vitest }} --no-save
      - run: npm test
      - run: npm run lint
      - run: npm run type-check
      - run: npm run docs
        if: matrix.os == 'ubuntu-latest' && matrix.vitest == 5
